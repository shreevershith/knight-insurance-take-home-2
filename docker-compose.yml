# docker compose up --build   ->  http://localhost:8000  (app, worker, Postgres 18)
# The web app enqueues jobs, workers run them (D-36), Postgres 18 holds both (D-33). Secrets come from .env (never baked into the image):
# ANTHROPIC_API_KEY, and POSTGRES_PASSWORD for this container database.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: knight
      POSTGRES_DB: knight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knight -d knight"]
      interval: 5s
      timeout: 3s
      retries: 20
    # no published port: only the app reaches it (the host's own Postgres on 5432 is untouched)

  app:
    build: .
    env_file: .env
    environment: &app_env
      # overrides the host DATABASE_URL in .env: inside compose the database is the "db" service
      DATABASE_URL: postgresql+psycopg://knight:${POSTGRES_PASSWORD}@db:5432/knight
      DATA_DIR: /app/data
      JOB_MODE: queue   # the web app only enqueues; the worker service runs the jobs (D-36)
      # D-51: LangGraph runs the stages (checkpoints in this Postgres, review as interrupt/resume) and
      # LangChain's ChatAnthropic sends model requests. Roll back with PIPELINE_ENGINE=code / LLM_CLIENT=sdk.
      PIPELINE_ENGINE: ${PIPELINE_ENGINE:-graph}
      LLM_CLIENT: ${LLM_CLIENT:-langchain}
      # D-52: Langfuse keys and base URL come from .env; traces from this stack are labelled by environment
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-docker}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # the host's data/ folder: the LLM cache and cost ledger are shared with local runs
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Jobs from the queue, one at a time per worker; more workers = more submissions at once:
  #   docker compose up -d --scale worker=3
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment: *app_env
    volumes:
      - ./data:/app/data
    healthcheck:
      disable: true   # no HTTP port; the Dockerfile's check is for the web app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pgdata:
