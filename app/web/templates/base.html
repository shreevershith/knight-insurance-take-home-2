<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Knight Intake{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
  /* "Parchment & Ledger": archival paper, ink, hairlines. Colour only for risk state; no shadows, square corners. */
  :root {
    interpolate-size: allow-keywords;
    --bg:#FBF9F5; --surface:#F5F2EB; --surface-2:#EAE5DC; --sunken:#EFECE4;
    --ink:#111111; --ink-2:#1C1917; --muted:#666660; --faint:#8C8A84; --line:#E4E0D6; --line-strong:#DDD8CC;
    --accent:#1C1917; --accent-2:#1C1917; --accent-ink:#FBF9F5; --accent-hover:#33302C;
    --good-fg:#15803D; --good-bg:#F0FDF4; --good-line:#BBF7D0;
    --bad-fg:#B91C1C;  --bad-bg:#FEF2F2;  --bad-line:#FECACA;
    --warn-fg:#B45309; --warn-bg:#FFFBEB; --warn-line:#FDE68A;
    --violet-fg:#6B21A8; --violet-bg:#FAF5FF; --violet-line:#E9D5FF;
    --info-fg:#1E40AF; --info-bg:#EFF6FF; --info-line:#BFDBFE;
    --neutral-fg:#4D4540; --neutral-bg:#EFECE4; --neutral-line:#DDD8CC;
    --scrim:rgba(245,242,235,.8);
    --ease:cubic-bezier(.2,.7,.2,1);
    --serif:Newsreader, "Iowan Old Style", Georgia, serif;
    --sans:Geist, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#12110F; --surface:#1A1916; --surface-2:#26241F; --sunken:#201E1A;
    --ink:#F2EDE1; --ink-2:#E2DCCD; --muted:#A39E92; --faint:#7C776D; --line:#2E2B25; --line-strong:#3A362F;
    --accent:#F2EDE1; --accent-2:#F2EDE1; --accent-ink:#12110F; --accent-hover:#D9D3C4;
    --good-fg:#4ADE80; --good-bg:rgba(21,128,61,.16); --good-line:rgba(74,222,128,.3);
    --bad-fg:#F87171;  --bad-bg:rgba(185,28,28,.18); --bad-line:rgba(248,113,113,.32);
    --warn-fg:#FBBF24; --warn-bg:rgba(180,83,9,.18); --warn-line:rgba(251,191,36,.32);
    --violet-fg:#C4B5FD; --violet-bg:rgba(107,33,168,.22); --violet-line:rgba(196,181,253,.3);
    --info-fg:#93C5FD; --info-bg:rgba(30,64,175,.22); --info-line:rgba(147,197,253,.3);
    --neutral-fg:#C9C3B6; --neutral-bg:#26241F; --neutral-line:#3A362F;
    --scrim:rgba(8,8,6,.7);
    color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg:#12110F; --surface:#1A1916; --surface-2:#26241F; --sunken:#201E1A;
    --ink:#F2EDE1; --ink-2:#E2DCCD; --muted:#A39E92; --faint:#7C776D; --line:#2E2B25; --line-strong:#3A362F;
    --accent:#F2EDE1; --accent-2:#F2EDE1; --accent-ink:#12110F; --accent-hover:#D9D3C4;
    --good-fg:#4ADE80; --good-bg:rgba(21,128,61,.16); --good-line:rgba(74,222,128,.3);
    --bad-fg:#F87171;  --bad-bg:rgba(185,28,28,.18); --bad-line:rgba(248,113,113,.32);
    --warn-fg:#FBBF24; --warn-bg:rgba(180,83,9,.18); --warn-line:rgba(251,191,36,.32);
    --violet-fg:#C4B5FD; --violet-bg:rgba(107,33,168,.22); --violet-line:rgba(196,181,253,.3);
    --info-fg:#93C5FD; --info-bg:rgba(30,64,175,.22); --info-line:rgba(147,197,253,.3);
    --neutral-fg:#C9C3B6; --neutral-bg:#26241F; --neutral-line:#3A362F;
    --scrim:rgba(8,8,6,.7);
    color-scheme: dark;
  }

  /* ---------- base ---------- */
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:110px; }
  body { margin:0; background:var(--bg); color:var(--ink-2); font:13px/1.55 var(--sans); -webkit-font-smoothing:antialiased;
         font-feature-settings:"tnum", "zero"; }
  ::selection { background:var(--surface-2); color:var(--ink); }
  a { color:var(--ink); text-decoration:underline; text-decoration-color:var(--line-strong); text-underline-offset:3px;
      transition:text-decoration-color .2s; }
  a:hover { text-decoration-color:var(--ink); }
  h1 { font:400 36px/1.22 var(--serif); letter-spacing:-.02em; color:var(--ink); margin:2px 0 4px; }
  h2 { font:500 20px/1.4 var(--serif); letter-spacing:-.01em; color:var(--ink); margin:0; }
  h3 { font:600 11px/1.3 var(--sans); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
  .serif { font-family:var(--serif); }
  code, .mono { font-family:var(--mono); font-size:12px; }
  code { background:var(--sunken); border:1px solid var(--line); padding:0 5px; color:var(--ink-2); }
  .muted { color:var(--muted); } .faint { color:var(--faint); } .small { font-size:12px; } .nowrap { white-space:nowrap; }
  .caps { font:600 11px/1.3 var(--sans); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  :focus-visible { outline:1px solid var(--ink-2); outline-offset:2px; }

  /* ---------- app shell ---------- */
  .topbar { position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--line); }
  .topbar-in { height:56px; padding:0 24px; display:flex; align-items:center; gap:14px; }
  .brand { display:flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none; font:500 18px/1 var(--serif); letter-spacing:-.01em; }
  .brand-mark { width:8px; height:8px; border-radius:50%; background:var(--ink); }
  .topbar .spacer { flex:1; }
  .tag { font:600 10.5px/1 var(--sans); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:4px 6px;
         background:var(--surface-2); border:1px solid var(--line-strong); }
  .engine { display:flex; align-items:center; gap:8px; padding:4px 10px; border:1px solid var(--line-strong); background:var(--surface);
            font:400 11px/1.4 var(--mono); color:var(--ink-2); }
  .engine::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--good-fg); animation:blink 2s ease-in-out infinite; }
  .icon-btn { width:30px; height:30px; border:1px solid var(--line-strong); background:var(--bg); color:var(--ink-2);
              display:grid; place-items:center; cursor:pointer; transition:background .2s; font-size:14px; }
  .icon-btn:hover { background:var(--sunken); }
  main { max-width:1320px; margin:0 auto; padding:24px 24px 96px; }

  /* ---------- ledger surfaces ---------- */
  .card { background:var(--bg); border:1px solid var(--line); padding:20px 22px; margin:20px 0; }
  .card-head { display:flex; align-items:baseline; gap:10px; margin-bottom:14px; flex-wrap:wrap; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .card-head .count { font:600 11px/1 var(--sans); text-transform:uppercase; letter-spacing:.06em; color:var(--faint); }
  .card-head .grow { flex:1; }
  .rise { animation:rise .5s var(--ease) both; animation-delay:calc(var(--i, 0) * 60ms); }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  @keyframes blink { 50% { opacity:.3; } }

  /* ---------- pills: hairline rects ---------- */
  .pill { --t-bg:var(--neutral-bg); --t-fg:var(--neutral-fg); --t-line:var(--neutral-line);
          display:inline-flex; align-items:center; gap:6px; white-space:nowrap; padding:2px 7px; border-radius:2px;
          font:600 10.5px/1.45 var(--sans); text-transform:uppercase; letter-spacing:.06em;
          background:var(--t-bg); color:var(--t-fg); border:1px solid var(--t-line); transition:background .3s, color .3s, border-color .3s; }
  .pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.plain::before { display:none; }
  .PASS, .OK, .RESOLVED, .DONE, .READY_TO_QUOTE, .tone-good { --t-bg:var(--good-bg); --t-fg:var(--good-fg); --t-line:var(--good-line); }
  .REFER, .LOW_CONFIDENCE, .OPEN, .tone-warn, .medium { --t-bg:var(--warn-bg); --t-fg:var(--warn-fg); --t-line:var(--warn-line); }
  .DECLINE, .ERROR, .MODEL_ERROR, .UNREADABLE, .FAILED, .INTERRUPTED, .tone-bad, .high { --t-bg:var(--bad-bg); --t-fg:var(--bad-fg); --t-line:var(--bad-line); }
  .FLAG, .PROCESSING, .RECEIVED, .tone-info, .low { --t-bg:var(--info-bg); --t-fg:var(--info-fg); --t-line:var(--info-line); }
  .NOT_EVALUATED, .UNCLASSIFIED, .UNSUPPORTED, .tone-violet, .human { --t-bg:var(--violet-bg); --t-fg:var(--violet-fg); --t-line:var(--violet-line); }
  .PROCESSING::before, .RECEIVED::before { animation:blink 1.2s ease-in-out infinite; }

  /* ---------- buttons & inputs ---------- */
  .btn, button { font:600 11px/1 var(--sans); text-transform:uppercase; letter-spacing:.06em; display:inline-flex; align-items:center;
                 gap:6px; cursor:pointer; border-radius:0; padding:8px 14px; border:1px solid var(--line-strong); background:transparent;
                 color:var(--ink-2); text-decoration:none; transition:background .2s, color .2s, border-color .2s, opacity .2s; }
  .btn:hover, button:hover { background:var(--sunken); }
  .btn:active, button:active { background:var(--surface-2); }
  .btn.primary, button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover, button.primary:hover { background:var(--accent-hover); }
  .btn.sm, button.sm { padding:5px 9px; font-size:10.5px; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input[type=text], input[type=search], select { font:13px var(--sans); color:var(--ink); background:var(--bg); border:1px solid var(--line-strong);
        border-radius:0; padding:7px 10px; min-width:0; transition:border-color .2s; }
  input[type=text]:focus, input[type=search]:focus, select:focus { outline:none; border-color:var(--ink-2); }
  input[type=checkbox] { accent-color:var(--ink-2); }

  /* ---------- tables: ledger rows ---------- */
  .table-wrap { overflow-x:auto; }
  table { border-collapse:separate; border-spacing:0; width:100%; }
  th { text-align:left; font:600 10.5px/1.3 var(--sans); text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
       padding:8px 12px; background:var(--sunken); border-bottom:1px solid var(--ink-2); position:sticky; top:0; }
  td { padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top; transition:background .15s, box-shadow .15s; }
  tr:last-child td { border-bottom:0; }
  tbody tr:hover td { background:var(--surface-2); }
  tbody tr:hover td:first-child { box-shadow:inset 2px 0 0 var(--ink-2); }
  tr.target td { animation:flash 1.8s var(--ease); }
  @keyframes flash { 0%, 35% { background:var(--warn-bg); } }

  /* ---------- disclosure (animated height) ---------- */
  details > summary { cursor:pointer; list-style:none; }
  details > summary::-webkit-details-marker { display:none; }
  .chev { display:inline-block; transition:transform .25s var(--ease); color:var(--faint); font-family:var(--mono); }
  details[open] > summary .chev { transform:rotate(90deg); }
  details::details-content { height:0; overflow:clip; transition:height .32s var(--ease), content-visibility .32s allow-discrete; }
  details[open]::details-content { height:auto; }

  /* ---------- meters ---------- */
  .meter { display:inline-flex; align-items:center; gap:8px; }
  .meter-track { width:48px; height:4px; background:var(--line); overflow:hidden; }
  .meter-fill { height:100%; background:var(--good-fg); transform-origin:left; animation:grow .7s var(--ease) both; }
  .meter-fill.lo { background:var(--warn-fg); } .meter-fill.vlo { background:var(--bad-fg); }
  @keyframes grow { from { transform:scaleX(0); } }

  /* ---------- drawer (Level 2: ink outline, parchment scrim) ---------- */
  .scrim { position:fixed; inset:0; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .3s; z-index:60; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(560px, 100vw); background:var(--bg); z-index:61;
            border-left:2px solid var(--ink-2); transform:translateX(102%); transition:transform .38s var(--ease); display:flex; flex-direction:column; }
  body.drawer-open .scrim { opacity:1; pointer-events:auto; }
  body.drawer-open .drawer { transform:none; }
  .drawer-head { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; gap:12px; background:var(--surface); }
  .drawer-head #dr-kicker { font-family:var(--mono); font-size:11px; }
  .drawer-body { padding:18px 22px 32px; overflow:auto; flex:1; }
  .drawer-body .value { font:400 28px/1.25 var(--serif); letter-spacing:-.015em; color:var(--ink); margin:2px 0 10px; word-break:break-word; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:0; font-size:13px; margin:14px 0 18px; border:1px solid var(--line); }
  .kv dt { color:var(--muted); padding:6px 10px; border-bottom:1px solid var(--line); background:var(--surface); }
  .kv dd { margin:0; padding:6px 10px; border-bottom:1px solid var(--line); }
  .kv dt:nth-last-of-type(1), .kv dd:last-child { border-bottom:0; }
  .excerpt { font-family:var(--mono); font-size:12px; background:var(--sunken); border:1px solid var(--line); padding:10px 12px;
             white-space:pre-wrap; word-break:break-word; color:var(--ink-2); }
  .excerpt mark { background:transparent; color:inherit; border-bottom:2px solid var(--warn-fg); }
  .checks { list-style:none; padding:0; margin:10px 0 0; display:grid; gap:3px; font-size:12px; font-family:var(--mono); }
  .checks .y { color:var(--good-fg); } .checks .n { color:var(--bad-fg); }
  .override { display:grid; gap:8px; }
  .page-img { margin-top:16px; border:1px solid var(--line); background:var(--sunken); }
  .page-img img { display:block; width:100%; height:auto; opacity:0; transition:opacity .4s; }
  .page-img img.loaded { opacity:1; }

  /* ---------- toast ---------- */
  .toast { position:fixed; left:50%; bottom:24px; z-index:70; transform:translate(-50%, 16px); opacity:0; background:var(--ink-2); color:var(--bg);
           padding:10px 16px; font-weight:500; display:flex; gap:10px; align-items:center; border:1px solid var(--ink-2);
           transition:opacity .3s, transform .4s var(--ease); max-width:calc(100vw - 32px); }
  .toast.show { opacity:1; transform:translate(-50%, 0); }
  .toast .tick { width:16px; height:16px; background:var(--good-fg); color:var(--bg); display:grid; place-items:center; font-size:10px; flex:none; }

  @media (max-width: 720px) {
    .topbar-in, main { padding-left:16px; padding-right:16px; }
    .topbar .tag, .engine { display:none; }
    h1 { font-size:28px; }
    .card { padding:16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important;
                             transition-duration:.01ms !important; scroll-behavior:auto !important; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/"><span class="brand-mark"></span>Knight · Submission Intake</a>
    <span class="tag">Trucking program</span>
    <span class="spacer"></span>
    <span class="engine" title="Model per task (D-31)">{% block engine %}Claude · per-task routing{% endblock %}</span>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
  </div>
</header>
<main>{% block body %}{% endblock %}</main>

<div class="scrim" data-close></div>
<aside class="drawer" aria-hidden="true" aria-labelledby="dr-title" role="dialog">
  <div class="drawer-head">
    <div style="flex:1; min-width:0">
      <div class="muted" id="dr-kicker"></div>
      <h2 id="dr-title"></h2>
    </div>
    <button class="icon-btn" type="button" data-close aria-label="Close">✕</button>
  </div>
  <div class="drawer-body" id="dr-body"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="tick">✓</span><span id="toast-msg"></span></div>

<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // theme toggle (remembered per browser)
  $("#theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  });

  // toast: confirmation after an action (?ok=...)
  window.toast = msg => {
    const t = $("#toast"); $("#toast-msg").textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 4200);
  };
  const ok = new URLSearchParams(location.search).get("ok");
  if (ok) { setTimeout(() => toast(ok), 250); history.replaceState(null, "", location.pathname + location.hash); }

  // drawer
  const open = (kicker, title, html) => {
    $("#dr-kicker").textContent = kicker; $("#dr-title").textContent = title; $("#dr-body").innerHTML = html;
    document.body.classList.add("drawer-open"); $(".drawer").setAttribute("aria-hidden", "false");
    $$("#dr-body img").forEach(img => img.complete ? img.classList.add("loaded") : img.addEventListener("load", () => img.classList.add("loaded")));
    setTimeout(() => $(".drawer [data-close]").focus(), 50);
  };
  const close = () => { document.body.classList.remove("drawer-open"); $(".drawer").setAttribute("aria-hidden", "true"); };
  $$("[data-close]").forEach(el => el.addEventListener("click", close));
  addEventListener("keydown", e => { if (e.key === "Escape") close(); });

  const highlight = (excerpt, value) => {
    const e = esc(excerpt), v = esc(value).trim();
    if (!v || v.length < 2) return e;
    const i = e.toLowerCase().indexOf(v.toLowerCase());
    return i < 0 ? e : e.slice(0, i) + "<mark>" + e.slice(i, i + v.length) + "</mark>" + e.slice(i + v.length);
  };
  window.openEvidence = async el => {
    open("Loading…", "", `<div class="excerpt" style="opacity:.5">Loading evidence…</div>`);
    let d;
    try { d = await (await fetch(`/fields/${el.dataset.id}`)).json(); }
    catch (e) { $("#dr-body").innerHTML = "<p class='muted'>Could not load this value.</p>"; return; }
    const conf = +d.confidence, checks = d.checks || {};
    const list = Object.entries(checks).filter(([, v]) => v === true || v === false)
      .map(([k, v]) => `<li class="${v ? "y" : "n"}">${v ? "✓" : "✗"} ${esc(k.replaceAll("_", " "))}</li>`).join("");
    const tone = conf >= .85 ? "" : conf >= .6 ? "lo" : "vlo";
    $("#dr-kicker").textContent = d.entity; $("#dr-title").textContent = d.field;
    $("#dr-body").innerHTML = (`
      <div class="value">${esc(d.value)}</div>
      <span class="pill ${esc(d.status)}">${esc(d.status)}</span>
      <dl class="kv">
        <dt>Confidence</dt><dd><span class="meter"><span class="meter-track"><span class="meter-fill ${tone}" style="width:${Math.round(conf * 100)}%"></span></span>${conf.toFixed(2)}</span></dd>
        <dt>Method</dt><dd>${esc(d.method)}</dd>
        <dt>Source</dt><dd>${esc(d.source || "human decision")}</dd>
        <dt>Field id</dt><dd><code>F${esc(d.id)}</code></dd>
      </dl>
      <h3>Evidence on the page</h3>
      <div class="excerpt">${d.excerpt ? highlight(d.excerpt, d.value) : "<span class='muted'>No excerpt</span>"}</div>
      ${list ? `<ul class="checks">${list}</ul>` : ""}
      ${d.image ? `<div class="page-img"><img src="${esc(d.image)}" alt="Source page"></div>
                   <p class="small"><a href="${esc(d.image)}" target="_blank" rel="noopener">Open full size ↗</a></p>` : ""}
      ${d.status !== "SUPERSEDED" && d.status !== "REPLACED" ? `
      <h3 style="margin-top:22px">Correct this value</h3>
      <form method="post" action="/fields/${d.id}/override" class="override">
        <input type="text" name="value" value="${esc(d.value)}" aria-label="Corrected value">
        <input type="text" name="reason" placeholder="Reason (required, goes to the audit log)" required aria-label="Reason">
        <button class="primary" ${el.dataset.running === "1" ? "disabled" : ""}>Save and re-run rules</button>
      </form>` : ""}`);
    $$("#dr-body img").forEach(img => img.complete ? img.classList.add("loaded") : img.addEventListener("load", () => img.classList.add("loaded")));
  };
  window.openPage = el => open(el.dataset.kicker, el.dataset.title,
    `<p class="small muted">${esc(el.dataset.note || "")}</p><div class="page-img"><img src="${esc(el.dataset.image)}" alt="Page image"></div>
     <p class="small"><a href="${esc(el.dataset.image)}" target="_blank" rel="noopener">Open full size ↗</a></p>`);
  document.addEventListener("click", e => {
    const ev = e.target.closest("[data-evidence]"); if (ev) { e.preventDefault(); openEvidence(ev); return; }
    const pg = e.target.closest("[data-page]"); if (pg) { e.preventDefault(); openPage(pg); return; }
    const ref = e.target.closest("a[href^='#F']");       // evidence chips: open the cited value
    if (ref) {
      const btn = $(ref.getAttribute("href") + " [data-evidence]");
      if (btn) { e.preventDefault(); const d = btn.closest("details"); if (d) d.open = true; openEvidence(btn); }
    }
  });

  // count-up for stat numbers
  $$("[data-count]").forEach(el => {
    const end = +el.dataset.count; if (!end || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const t0 = performance.now(), dur = 700;
    const tick = t => { const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3)));
                        if (p < 1) requestAnimationFrame(tick); };
    el.textContent = "0"; requestAnimationFrame(tick);
  });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
