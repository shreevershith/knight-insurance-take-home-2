<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Knight Intake{% endblock %}</title>
<style>
/* Parchment & ledger, document layout: one centred page, a packet column on the left, results on the right.
   Serif headings over an ink rule; colour only for state. Light only. */
:root {
  --bg: #fbf9f5; --surface: #fffdf9; --panel: #f5f2eb; --well: #efece4; --ink: #111111; --ink-2: #3a3833; --muted: #6b6963; --faint: #a19e96;
  --line: #e4e0d6; --line-2: #d6d1c4; --hover: #f2eee5;
  --pass: #15803d; --pass-bg: #f0fdf4; --pass-ln: #bbf7d0; --flag: #b91c1c; --flag-bg: #fef2f2; --flag-ln: #fecaca;
  --unk: #b45309; --unk-bg: #fffbeb; --unk-ln: #fde68a; --gray: #57554f; --gray-bg: #efece4; --gray-ln: #ddd8cc;
  --ovr: #6b21a8; --ovr-bg: #faf5ff; --ovr-ln: #e9d5ff; --r: 3px; --ease: cubic-bezier(.2, .7, .2, 1);
  --serif: "Iowan Old Style", "Charter", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 112px; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
body { font-variant-numeric: tabular-nums; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: var(--r); }
a { color: var(--ink); text-underline-offset: 3px; text-decoration-color: var(--line-2); }
a:hover { text-decoration-color: var(--ink); }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
.serif { font-family: var(--serif); font-weight: 500; letter-spacing: -0.015em; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; } .mono { font-family: var(--mono); font-size: 12px; }
.nowrap { white-space: nowrap; } .hidden { display: none !important; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); height: 53px; border-bottom: 1px solid var(--line); }
.top-in { max-width: 1320px; margin: 0 auto; height: 52px; padding: 0 32px; display: flex; align-items: center; gap: 10px; }
.mark { width: 18px; height: 18px; border-radius: 2px; background: var(--ink); display: grid; place-items: center; color: #fff; font: 700 10.5px/1 var(--sans); }
.brand { font-weight: 650; font-size: 14px; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
.sep { color: var(--line-2); font-size: 14px; }
.brand-sub { color: var(--faint); font-size: 12px; }
.spacer { flex: 1; }
.model { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-2); padding: 3px 9px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); }
.model .mk { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; display: inline-block; }
.dot.ok { background: var(--pass); } .dot.bad { background: var(--flag); } .dot.warn { background: var(--unk); }

/* ---------- page: packet column + results ---------- */
.wrap { max-width: 1320px; margin: 0 auto; padding: 28px 32px 80px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 40px; }
.side { position: sticky; top: 72px; align-self: start; }
.side h2 { font-size: 15px; margin: 6px 0 14px; }
.results { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 44px; align-content: start; }
@media (max-width: 980px) {
  .wrap { grid-template-columns: minmax(0, 1fr); padding: 20px 16px 60px; gap: 24px; }
  .side { position: static; } .top-in { padding: 0 16px; } .brand-sub, .sep, .model { display: none; }
}

/* ---------- packet panel ---------- */
.drop { position: relative; display: block; border: 1px dashed var(--line-2); border-radius: var(--r); padding: 22px 14px; text-align: center;
        background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--ink); background: var(--hover); }
.drop b { display: block; font-weight: 600; font-size: 13.5px; }
.drop span { font-size: 12px; color: var(--muted); }
.files { list-style: none; margin: 10px 0 0; padding: 0; }
.files li { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
.files li:last-child { border-bottom: 0; }
.ext { font: 600 10px/1 var(--mono); text-transform: uppercase; color: var(--muted); border: 1px solid var(--line-2); border-radius: var(--r); padding: 3px 4px; min-width: 34px; text-align: center; }
.files .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { border: 0; background: none; cursor: pointer; color: var(--faint); font-size: 17px; line-height: 1; padding: 0 2px; }
.x:hover { color: var(--flag); }
.side .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 14px; }
.side .actions form { display: contents; }
.note { font-size: 11.5px; color: var(--faint); margin: 14px 0 0; line-height: 1.5; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface);
       border-radius: var(--r); padding: 8px 14px; cursor: pointer; font-weight: 550; font-size: 13.5px; white-space: nowrap; color: var(--ink);
       text-decoration: none; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--hover); border-color: var(--faint); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.primary:hover { background: #2a2a28; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn.link { border: 0; background: none; padding: 0; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); font-size: 13px; }
.btn.link:hover { text-decoration-color: var(--ink); background: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
input[type=text], input[type=search], textarea, select { width: 100%; border: 1px solid var(--line-2); border-radius: var(--r); padding: 8px 11px; background: var(--surface); }
input[type=text]:focus, input[type=search]:focus, textarea:focus, select:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(17,17,17,.06); }

/* ---------- pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border: 1px solid var(--gray-ln); border-radius: 2px;
        font: 600 11px/1.5 var(--sans); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; color: var(--gray); background: var(--gray-bg); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain::before { display: none; }
.PASS, .OK, .RESOLVED, .DONE, .READY_TO_QUOTE { color: var(--pass); background: var(--pass-bg); border-color: var(--pass-ln); }
.DECLINE, .ERROR, .MODEL_ERROR, .UNREADABLE, .FAILED, .INTERRUPTED, .high { color: var(--flag); background: var(--flag-bg); border-color: var(--flag-ln); }
.REFER, .LOW_CONFIDENCE, .OPEN, .CONFLICT, .medium { color: var(--unk); background: var(--unk-bg); border-color: var(--unk-ln); }
.FLAG, .NOT_EVALUATED, .UNCLASSIFIED, .UNSUPPORTED, .SKIPPED, .SUPERSEDED, .DUPLICATE, .CONTAINER, .PENDING, .low, .neutral { color: var(--gray); background: var(--gray-bg); border-color: var(--gray-ln); }
.PROCESSING, .RECEIVED { color: var(--ink-2); background: var(--surface); border-color: var(--line-2); }
.PROCESSING::before, .RECEIVED::before { animation: blink 1.2s ease-in-out infinite; }
.human, .OVERRIDE { color: var(--ovr); background: var(--ovr-bg); border-color: var(--ovr-ln); }
@keyframes blink { 50% { opacity: .25; } }

/* ---------- sections ---------- */
.sec-hd { display: flex; align-items: baseline; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); margin-bottom: 4px; flex-wrap: wrap; }
.sec-hd h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; letter-spacing: -0.015em; }
.sec-hd .aside { color: var(--muted); font-size: 12.5px; }
.sec-hd .right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
section { scroll-margin-top: 112px; }
.alert { border-radius: var(--r); padding: 14px 16px; border: 1px solid; font-size: 13.5px; }
.alert.err { background: var(--flag-bg); border-color: #f1c7c0; color: #6f1a10; }
.alert.warn { background: var(--unk-bg); border-color: #f0dbb0; color: #5a3900; }
.alert b { display: block; margin-bottom: 4px; }
.alert ul { margin: 6px 0 0; padding-left: 18px; }
.allclear { padding: 18px 0; display: flex; gap: 12px; align-items: center; font-size: 15px; }
.allclear .tick { width: 26px; height: 26px; border-radius: 50%; background: var(--pass-bg); color: var(--pass); display: grid; place-items: center; font-weight: 700; }

/* ---------- tables ---------- */
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; vertical-align: top; padding: 11px 12px 11px 0; border-bottom: 1px solid var(--line); }
th { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
.tbl { overflow-x: auto; }

/* ---------- evidence quote ---------- */
q.snip, .snip { quotes: none; display: inline-block; font: 12px/1.5 var(--mono); color: var(--ink-2); background: var(--well); border: 1px solid var(--line);
                border-radius: 2px; padding: 3px 8px; max-width: 100%; overflow-wrap: anywhere; }
.loc { font-size: 11.5px; color: var(--muted); } .loc b { color: var(--ink-2); font-weight: 600; }

/* ---------- drawer (page image) ---------- */
.scrim { position: fixed; inset: 0; background: rgba(245, 242, 235, .8); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100vw); background: var(--bg); z-index: 61; border-left: 1px solid var(--line-2);
          box-shadow: -24px 0 48px -32px rgba(17,17,17,.35); transform: translateX(102%); transition: transform .32s var(--ease); display: flex; flex-direction: column; }
body.drawer-open .scrim { opacity: 1; pointer-events: auto; } body.drawer-open .drawer { transform: none; }
.drawer-head { padding: 16px 22px; border-bottom: 1px solid var(--ink); display: flex; align-items: flex-start; gap: 12px; }
.drawer-head h2 { font-family: var(--serif); font-weight: 500; font-size: 20px; }
.drawer-body { padding: 18px 22px 32px; overflow: auto; flex: 1; }
.drawer-body .value { font-family: var(--serif); font-size: 24px; line-height: 1.25; margin: 0 0 8px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 13px; margin: 14px 0 16px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.checks { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 2px; font: 12px/1.5 var(--mono); }
.checks .y { color: var(--pass); } .checks .n { color: var(--flag); }
.page-img { margin-top: 16px; border: 1px solid var(--line); background: var(--well); }
.page-img img { display: block; width: 100%; height: auto; opacity: 0; transition: opacity .35s; }
.page-img img.loaded { opacity: 1; }
mark { background: transparent; color: inherit; border-bottom: 2px solid var(--unk); }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 70; transform: translate(-50%, 14px); opacity: 0; background: var(--ink); color: #fff;
         padding: 10px 16px; border-radius: var(--r); font-size: 13.5px; transition: opacity .25s, transform .35s var(--ease); max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="mark" aria-hidden="true">K</div>
    <a class="brand" href="/">Knight Intake</a>
    <span class="sep" aria-hidden="true">/</span>
    <span class="brand-sub">Commercial auto · trucking program submissions</span>
    <div class="spacer"></div>
    <span class="model" title="Model per task. A cheap model's result that fails a code check is re-run on Opus."><span class="mk">Models</span><span class="dot ok"></span>{{ model_chip() }}</span>
  </div>
</header>

<div class="wrap">
  <aside class="side">{% block side %}{% endblock %}</aside>
  <main class="results" id="results">{% block body %}{% endblock %}</main>
</div>

<div class="scrim" data-close></div>
<aside class="drawer" aria-hidden="true" aria-labelledby="dr-title" role="dialog">
  <div class="drawer-head">
    <div style="flex:1; min-width:0"><div class="eyebrow" id="dr-kicker"></div><h2 id="dr-title"></h2></div>
    <button class="btn sm" type="button" data-close aria-label="Close">Close</button>
  </div>
  <div class="drawer-body" id="dr-body"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  window.$esc = esc;

  // confirmation after an action (?ok=...)
  window.toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("show");
                          clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 4000); };
  const ok = new URLSearchParams(location.search).get("ok");
  if (ok) { setTimeout(() => toast(ok), 200); history.replaceState(null, "", location.pathname + location.hash); }

  // drawer: the scanned page behind a value
  const open = (kicker, title, html) => {
    $("#dr-kicker").textContent = kicker; $("#dr-title").textContent = title; $("#dr-body").innerHTML = html;
    document.body.classList.add("drawer-open"); $(".drawer").setAttribute("aria-hidden", "false");
    $$("#dr-body img").forEach(img => img.complete ? img.classList.add("loaded") : img.addEventListener("load", () => img.classList.add("loaded")));
    setTimeout(() => $(".drawer [data-close]").focus(), 50);
  };
  const close = () => { document.body.classList.remove("drawer-open"); $(".drawer").setAttribute("aria-hidden", "true"); };
  $$("[data-close]").forEach(el => el.addEventListener("click", close));
  addEventListener("keydown", e => { if (e.key === "Escape") close(); });

  const highlight = (excerpt, value) => {
    const e = esc(excerpt), v = esc(value).trim();
    const i = v.length > 1 ? e.toLowerCase().indexOf(v.toLowerCase()) : -1;
    return i < 0 ? e : e.slice(0, i) + "<mark>" + e.slice(i, i + v.length) + "</mark>" + e.slice(i + v.length);
  };
  window.openEvidence = async el => {
    open("Loading", "", "<p class='muted'>Loading…</p>");
    let d;
    try { d = await (await fetch(`/fields/${el.dataset.id}`)).json(); }
    catch (e) { $("#dr-body").innerHTML = "<p class='muted'>Could not load this value.</p>"; return; }
    const checks = Object.entries(d.checks || {}).filter(([, v]) => v === true || v === false)
      .map(([k, v]) => `<li class="${v ? "y" : "n"}">${v ? "✓" : "✗"} ${esc(k.replaceAll("_", " "))}</li>`).join("");
    $("#dr-kicker").textContent = el.dataset.entity || d.entity; $("#dr-title").textContent = d.field.replaceAll("_", " ");
    $("#dr-body").innerHTML = `
      <div class="value">${esc(d.value)}</div>
      <span class="pill ${esc(d.status)}">${esc(d.status.replaceAll("_", " "))}</span>
      <dl class="kv"><dt>Confidence</dt><dd>${(+d.confidence).toFixed(2)}</dd><dt>Method</dt><dd>${esc(d.method)}</dd>
        <dt>Source</dt><dd>${esc(d.source || "human decision")}</dd><dt>Field id</dt><dd class="mono">F${esc(d.id)}</dd></dl>
      <div class="eyebrow" style="margin-bottom:6px">Evidence on the page</div>
      <q class="snip">${d.excerpt ? highlight(d.excerpt, d.value) : "No excerpt"}</q>
      ${checks ? `<ul class="checks">${checks}</ul>` : ""}
      ${d.image ? `<div class="page-img"><img src="${esc(d.image)}" alt="Source page"></div>
                   <p class="small"><a href="${esc(d.image)}" target="_blank" rel="noopener">Open full size</a></p>` : "<p class='small muted'>No page image (spreadsheet or text source).</p>"}`;
    $$("#dr-body img").forEach(img => img.complete ? img.classList.add("loaded") : img.addEventListener("load", () => img.classList.add("loaded")));
  };
  window.openPage = el => open(el.dataset.kicker, el.dataset.title,
    `<p class="small muted">${esc(el.dataset.note || "")}</p><div class="page-img"><img src="${esc(el.dataset.image)}" alt="Page image"></div>
     <p class="small"><a href="${esc(el.dataset.image)}" target="_blank" rel="noopener">Open full size</a></p>`);
  document.addEventListener("click", e => {
    const ev = e.target.closest("[data-evidence]"); if (ev) { e.preventDefault(); openEvidence(ev); return; }
    const pg = e.target.closest("[data-page]"); if (pg) { e.preventDefault(); openPage(pg); }
  });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
