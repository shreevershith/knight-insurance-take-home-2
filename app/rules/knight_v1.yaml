# Knight Specialty Insurance - Trucking Program guideline (mockup), as executable config.
# Thresholds, lists and outcomes live here; each rule id maps to a small deterministic
# predicate in engine.py. The LLM never decides an outcome.
version: knight-trucking-v1.0
source: Knight_Guideline(Mockup).docx

settings:
  # D-07: windows are measured from the application date
  anchor_date_field: application_date
  # D-05: "non-listed states". domicile = only the home state must be listed; operating states
  # outside the list REFER. Set to "decline" to treat any operating state outside the list as prohibited.
  operating_states_mode: refer

params:
  available_states: [AL, AZ, AR, CA, SC, SD, TN, TX, UT, VA, WV, WI, WY]
  small_fleet_max_units: 10
  loss_run_max_age_days: 60
  mvr_max_age_days: 90
  loss_run_prior_years: 3
  ifta_quarters: 4
  min_cdl_years: 2
  min_driver_age: 23
  dot_medical_age: 65
  valid_license_statuses: [VALID]
  # D-16: "new venture" is undefined in the guideline; fewer years in business than this counts
  new_venture_max_years: 3
  # Driver point thresholds ("generally": REFER, never DECLINE; D-08 printed points, by violation date)
  points_max_36_months: 6
  points_max_12_months: 4
  dui_lookback_months: 60
  speeding_over_limit_mph: 30
  # Selective exposures
  selective_states: [IL]
  box_truck_min_premium: 250000
  low_premium_per_unit: 13000
  low_premium_min_units: 20
  # Prior insurance
  prior_coverage_years: 3
  max_lapse_days: 30

# Text patterns the rules match (case-insensitive regex). Kept here, not in code, so underwriting can
# widen a keyword list without a code change; every change shows up in rules_version (file hash).
patterns:
  # D-29: prohibited exposures decided from the commodity list ("not listed" is weaker than "answered No")
  commodity_prohibited:
    # whole words (held-out #4, D-46): 'batter' alone would match pancake batter, 'tow' paper towels,
    # 'recycl' recycled paper; these are commodities, not the prohibited exposure
    PRO-02: 'lithium|\bbatter(y|ies)\b'
    PRO-06: '\btow(s|ed|ing)?\b|tow truck|\brecovery\b|wreck'
    PRO-08: 'waste|garbage|\brefuse\b|trash|\bscrap\b|\brecycling\b'
  # PRO-03: states on the US/Mexico border, reported as context (proximity itself isn't determinable)
  border_states: [CA, AZ, NM, TX]
  # D-26: MVR history events that prove a CDL was held on that date
  cdl_event: '\bCDL\b|COMMERCIAL'
  # Vehicle types (matched on the schedule's type, or its model/body text when no type column exists)
  tractor: 'tractor|semi'
  ineligible_vehicle: 'straight truck|tow truck|wrecker|dump|concrete|mixer|pumper|crane|mobile equipment'
  # AMB-1: box trucks / transit vans are straight trucks, but the guideline names them as selective:
  # they go to SEL-02 (refer) and are not declined by APP-02
  box_truck: 'box truck|box van|transit|cargo van|step van'
  interstate: '48 states|interstate|nationwide|long haul|multi.?state'  # not 'regional': a region can be one state
  no_deductible: '^\s*(none|no|n/?a|do not offer|not requested|\$?\s*-|\$?\s*0(\.0+)?)\s*$'
  # Unacceptable driver history (DECLINE). DUI/DWI only within dui_lookback_months; the rest at any time (AMB-9)
  dui: '\bDUI\b|\bDWI\b|\bOWI\b|\bOUI\b|under the influence|intoxicat|impaired'
  unacceptable_history: 'vehicular (homicide|manslaughter|assault)|negligent driv|reckless|hit.?and.?run|leaving the scene|flee|fleeing|elud|felony|school bus'
  # "15-29 MPH OVER" -> 15..29; "31+ MPH OVER" -> 31..; a range that may exceed the limit is "possible", not a decline
  speeding_over: '(\d+)\s*(?:-|to)\s*(\d+)\s*mph\s*over|(\d+)\s*\+?\s*mph\s*over'
  auto_hauler: 'auto.?haul|car.?haul|automobiles|new cars|used cars|vehicle transport'
  small_entity: 'sole|proprietor|partnership|\bLLC\b|limited liability'
  corporation: 'corporation|\bcorp\b|\binc\b|incorporated'

# outcome: what happens when the rule fails. PASS / FLAG / REFER / DECLINE.
rules:
  # ---- appetite and coverage
  - id: APP-01
    title: Power units are tractors (semi-trucks)
    clause: "Target risk: Semi-trucks hauling general freight across state lines."
    outcome: REFER
  - id: APP-02
    title: No ineligible vehicle types
    clause: "Not eligible: Straight trucks, tow trucks, dump trucks, concrete mixers/pumpers, cranes, or mobile equipment regardless of GVW."
    outcome: DECLINE
  - id: APP-03
    title: Operates across state lines
    clause: "Target risk: Semi-trucks hauling general freight across state lines."
    outcome: REFER
  - id: COV-01
    title: No auto liability deductible requested
    clause: "Auto liability deductibles: Not allowed."
    outcome: REFER
  - id: COV-02
    title: Physical damage (APD) is not offered
    clause: "Auto physical damage: Not available."
    outcome: FLAG
  - id: NV-01
    title: New venture (sole prop / partnership / LLC) has 2 years CDL experience and a resume
    clause: "New ventures: Sole proprietors, partnerships, and LLCs acceptable with 2 years documented CDL experience and resume/letter of experience"
    outcome: REFER
  - id: NV-02
    title: New venture corporation needs underwriter review
    clause: "New ventures: ... corporations subject to underwriter review."
    outcome: REFER
  # ---- states
  - id: ST-01
    title: Domicile is an available state
    clause: "Available States: AL, AZ, AR, CA, SC, SD, TN, TX*, UT, VA, WV, WI, WY"
    outcome: DECLINE
  - id: ST-02
    title: Texas operations north of I-10
    clause: "*TX: Accounts must operate north of Interstate 10 (I-10)"
    outcome: REFER
  - id: ST-03
    title: Illinois-based accounts are selective
    clause: "Illinois-based accounts on selective basis."
    outcome: REFER
  - id: ST-04
    title: Operating states are available states
    # outcome follows settings.operating_states_mode (D-05): refer by default, decline if set
    clause: "Prohibited exposures: ... non-listed states"
    outcome: REFER
  # ---- submission completeness
  - id: SUB-01
    title: Application has FEIN or SSN
    clause: "Complete submission required: application with FEIN/SSN and MC/Docket number"
    outcome: REFER
  - id: SUB-02
    title: Application has MC / docket number
    clause: "Complete submission required: application with FEIN/SSN and MC/Docket number"
    outcome: REFER
  - id: SUB-03
    title: Loss runs valued within 60 days
    clause: "current loss runs valued within 60 days"
    outcome: REFER
  - id: SUB-04
    title: Loss runs for the expiring year and at least 3 prior years
    clause: "including expiring year and at least 3 prior years"
    outcome: REFER
  - id: SUB-05
    title: Most recent 4 quarters of IFTA returns
    clause: "most recent 4 quarters of IFTA reports"
    outcome: REFER
  - id: SUB-06
    title: Driver schedule present
    clause: "driver schedule with MVRs dated within 90 days of the application"
    outcome: REFER
  - id: SUB-07
    title: Every scheduled driver has an MVR dated within 90 days
    clause: "driver schedule with MVRs dated within 90 days of the application"
    outcome: REFER
  - id: SUB-08
    title: Vehicle schedule has year, make, 17-character VIN and stated value for every unit
    clause: "vehicle schedule with year, make, 17-character VIN and stated value"
    outcome: REFER
  # ---- drivers (D-06: baseline failures REFER; the unacceptable-history list DECLINEs)
  - id: DRV-01
    title: Every driver holds a valid U.S. driver license
    clause: "Driver baseline: Valid U.S. driver license and CDL"
    outcome: REFER
  - id: DRV-02
    title: Every driver holds a valid CDL
    clause: "Driver baseline: Valid U.S. driver license and CDL"
    outcome: REFER
  - id: DRV-03
    title: Every driver has 2+ years CDL experience
    clause: "Driver baseline: minimum 2 years CDL driving experience in the U.S. or Canada"
    outcome: REFER
  - id: DRV-04
    title: Every driver is 23 or older
    clause: "Driver baseline: age 23+"
    outcome: REFER
  - id: DRV-05
    title: Drivers 65+ have a DOT medical examination report
    clause: "drivers age 65+ must provide acceptable DOT medical examination report"
    outcome: REFER
  - id: DRV-06
    title: Driver points within thresholds
    clause: "Generally no more than 6 points in 3 years or 4 points in 12 months."
    outcome: REFER
  - id: DRV-07
    title: No DUI/DWI in the past 5 years
    clause: "Unacceptable driver history: DUI/DWI in past 5 years"
    outcome: DECLINE
  - id: DRV-08
    title: No other unacceptable driver history
    clause: "vehicular homicide/assault; negligent or reckless driving; speeding over 30 mph above limit; hit-and-run; fleeing/eluding; felony involving a motor vehicle; passing a stopped school bus"
    outcome: DECLINE
  # ---- prohibited exposures
  - id: PRO-01
    title: No hazardous materials
    clause: "Prohibited exposures: Hazardous materials"
    outcome: DECLINE
  - id: PRO-02
    title: No lithium battery cargo
    clause: "Prohibited exposures: lithium battery cargo"
    outcome: DECLINE
  - id: PRO-03
    title: No operations within 50 miles of the US/Mexico border
    clause: "Prohibited exposures: operations within 50 miles of the USA/Mexico border"
    outcome: DECLINE
    undetermined: VERIFY   # D-39: needs route data no submission has; a "yes" to cross-border still declines
  - id: PRO-05
    title: No serious SAFER violations
    clause: "Prohibited exposures: serious SAFER violations"
    outcome: DECLINE
    undetermined: VERIFY   # D-39: an FMCSA SAFER lookup on the DOT number, done before quoting
  - id: PRO-06
    title: No towing / recovery
    clause: "Prohibited exposures: towing/recovery"
    outcome: DECLINE
  - id: PRO-07
    title: No intermodal / container
    clause: "Prohibited exposures: intermodal/container"
    outcome: DECLINE
  - id: PRO-08
    title: No waste disposal
    clause: "Prohibited exposures: waste disposal"
    outcome: DECLINE
  # ---- selective exposures
  - id: SEL-01
    title: Automobile haulers are selective
    clause: "Selective exposures: Automobile haulers"
    outcome: REFER
  - id: SEL-02
    title: Box trucks / transit vans need a $250,000 minimum premium
    clause: "Selective exposures: box trucks/transit vans with minimum premium $250,000"
    outcome: REFER
  - id: SEL-03
    title: Under $13,000 per power unit needs 20+ power units
    clause: "accounts seeking less than $13,000 per power unit must have at least 20 power units"
    outcome: REFER
    undetermined: VERIFY   # D-39: the premium exists only after rating; checked at quoting
  # ---- prior insurance
  - id: PRI-01
    title: Continuous commercial auto coverage for the last 3 years
    clause: "Continuous commercial auto coverage for the most recent 3 years"
    outcome: REFER
  - id: PRI-02
    title: Any lapse over 30 days is explained
    clause: "any lapse over 30 days must be explained before quoting"
    outcome: REFER
  - id: PRI-03
    title: Losses reported for every prior term on the application
    clause: "Losses must be reported for every prior term listed on the application."
    outcome: REFER
  # ---- routing and referral
  - id: CONFLICTS
    title: No unresolved conflicting information
    clause: "Missing required documents, conflicting information or any other flag above: refer to an underwriter"
    outcome: REFER
  - id: RTE-01
    title: Route by power-unit count
    clause: "1-10 power units: Small Fleet underwriting; 11+ power units: Fleet underwriting"
    outcome: FLAG
